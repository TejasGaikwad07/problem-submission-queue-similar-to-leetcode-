name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: judge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/judge_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/judge_test
      REDIS_URL_TEST: redis://localhost:6379
      # fail (instead of skip) if Docker is unavailable, so a green build means the sandbox tests really ran
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-pull the sandbox images
        run: npm run judge:pull-images
      - name: Run migrations
        run: npm run db:migrate
      - run: npm run typecheck
      - name: Build the front end
        run: npm run build:web
      - name: Tests (the Docker sandbox tests run for real here)
        run: npm test
